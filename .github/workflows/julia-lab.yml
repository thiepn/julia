name: Julia Lab checks
on:
  pull_request:
    branches: [main, feature/julia-amp-ue02-numerical-workshops]
    paths:
      - "index.html"
      - "styles.css"
      - "src/**"
      - "sw.js"
      - "app.webmanifest"
      - "assets/**"
      - "local-runner/**"
      - "tests/**"
      - "package.json"
      - "README.md"
      - ".github/workflows/julia-lab.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and unit tests
        run: |
          node --check src/app.js
          node --check src/checks.js
          node --check src/lessons.js
          npm test
      - name: Install Julia 1.11 for authentic generated-test qualification
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - name: Execute generated Julia Test suites with fixed reference code
        run: node tests/julia-qualification.mjs
      - name: Run Julia UE02 numeric and syntax qualifications
        run: node tests/ue02-qualification.mjs
      - name: Execute genuine Julia local runner protocol regressions
        run: node tests/local-runner-qualification.mjs
      - name: Execute AMP numerical function missions with genuine Julia Test
        run: node tests/amp-julia-qualification.mjs
      - name: Run independent Julia depth and machine-arithmetic checks
        run: node tests/completion-julia.mjs
      - name: Execute authentic LR/QR and least-squares depth
        run: node tests/linear-depth-julia.mjs
      - name: Execute actual Julia environment diagnostic
        run: node tests/completion-diagnostics-julia.mjs
      - name: Install Playwright runner for browser acceptance
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get install -y poppler-utils
      - name: Chromium desktop/mobile acceptance
        run: node tests/browser.mjs
      - name: AMP workshops Chromium desktop/mobile
        run: node tests/amp-browser.mjs
      - name: Julia depth and proof scaffolds in Chromium desktop/mobile
        run: node tests/completion-browser.mjs
      - name: Studio navigation and responsive continuity in Chromium desktop/tablet/mobile
        run: node tests/studio-browser.mjs
      - name: Mixed-semester rehearsal in Chromium desktop/mobile
        run: node tests/semester-rehearsal-browser.mjs
      - name: LR/QR method comparison Chromium desktop/mobile
        run: node tests/linear-methods-browser.mjs
      - name: Real local Julia Test suites in Chromium desktop/mobile
        run: node tests/local-tests-browser.mjs
      - name: Execute original numerical experiments with genuine Julia in desktop/mobile Chromium
        run: node tests/local-experiments-browser.mjs
      - name: Run original learner repairs with real local Julia in desktop/mobile Chromium
        run: node tests/repair-local-browser.mjs
      - name: Genuine offline Julia Lab desktop/mobile service worker acceptance
        run: node tests/offline-browser.mjs
      - name: Portable lesson backup and conflict resolution in Chromium
        run: node tests/course-backup-browser.mjs
      - name: Julia G1/G2 three-engine desktop/mobile acceptance
        run: node tests/completion-g1g2-browser.mjs
      - name: AMP private PDF/ZIP submission and real Julia results in Chromium
        run: node tests/submission-browser.mjs

  authentic-plotting:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GKSwstype: "100"
      JULIA_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - uses: julia-actions/cache@v2
      - name: Install real Plots.jl and PrettyTables.jl (isolated CI environment)
        run: |
          julia --startup-file=no --color=no -e 'using Pkg; Pkg.add([Pkg.PackageSpec(name="Plots",version="1.41.7"), Pkg.PackageSpec(name="PrettyTables",version="3.5.0")]); using Plots, PrettyTables; gr(); println("JULIA PACKAGES READY")'
      - name: Execute actual learner Julia examples and verify generated outputs
        run: node tests/julia-package-qualification.mjs
      - name: Execute AMP PrettyTables and conditioning experiments
        run: node tests/amp-prettytables-qualification.mjs
      - name: Install Chromium for authentic figure preview acceptance
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y poppler-utils
      - name: Chromium desktop/mobile loads real exported Julia figures
        run: node tests/real-julia-plot-browser.mjs
      - name: Local runner executes real plot source in desktop/mobile Chromium
        run: node tests/local-runner-browser.mjs
      - name: Display original plotting repair figures with genuine Plots.jl in desktop/mobile Chromium
        run: node tests/repair-plot-browser.mjs
      - name: Private AMP submission ZIP includes genuine local Plots.jl images
        run: AMP_SUBMISSION_REAL_PLOTS=1 node tests/submission-browser.mjs

  r2-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install standalone Chromium browser runner
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: L1 learning-only navigation and preserved learner records
        run: node tests/learning-first-browser.mjs
      - name: R2 responsive and real screenshot acceptance
        run: R2_SCREENSHOTS=1 node tests/r2-browser.mjs
      - name: R2 legacy original Chromium learner acceptance (no Julia install needed)
        run: node tests/browser.mjs
      - name: R2 backup and restore navigation acceptance
        run: node tests/course-backup-browser.mjs
      - name: Upload screenshot review set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-visual-qa
          path: r2-screenshots/
          if-no-files-found: ignore
          retention-days: 7
