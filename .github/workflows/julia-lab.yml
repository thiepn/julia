name: Julia Lab checks
on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "src/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/julia-lab.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and unit tests
        run: |
          node --check src/app.js
          node --check src/checks.js
          node --check src/lessons.js
          npm test
      - name: Install Playwright runner for browser acceptance
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Chromium desktop/mobile acceptance
        run: node tests/browser.mjs

